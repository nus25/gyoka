packages:
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  '@atcute/atproto': 4.0.4
  '@atcute/bluesky': 4.0.26
  '@atcute/cid': 2.5.0
  '@atcute/crypto': 2.4.4
  '@atcute/identity': 2.0.2
  '@atcute/identity-resolver': 2.0.3
  '@atcute/lexicons': 2.1.1
  '@atcute/lex-cli': 3.3.0
  '@atcute/xrpc-server': 2.1.0
  '@cloudflare/vitest-plugin': 1.8.2
  '@cloudflare/vite-plugin': 1.69.1
  '@types/node': 25.5.0
  'vite': 8.3.8
  'vitest': 5.1.0
  '@vitest/coverage-istanbul': 5.1.0
  wrangler: 4.162.0


catalogMode: manual

cleanupUnusedCatalogs: true

minimumReleaseAge: 1440 # 24 hours

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
