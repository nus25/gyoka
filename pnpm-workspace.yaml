packages:
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  '@cloudflare/vitest-plugin': 1.3.0
  '@types/node': 25.5.0
  'vite': 7.3.6
  'vitest': 4.1.11
  '@vitest/coverage-istanbul': 4.1.10
  wrangler: 4.142.0
  hono: 4.13.9

overrides:
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2  # For Chanfana
  'undici': '>=7.29.0 <8.0.0' # For wrangler

catalogMode: manual

cleanupUnusedCatalogs: true

minimumReleaseAge: 1440 # 24 hours

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
