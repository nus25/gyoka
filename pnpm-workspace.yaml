packages:
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  '@cloudflare/vitest-pool-workers': 0.20.2
  '@cloudflare/workers-types': 5.20260801.1
  '@types/node': 25.5.0
  'vite': 7.3.6
  'vitest': 4.1.10
  '@vitest/coverage-istanbul': 4.1.10
  wrangler: 4.119.0
  hono: 4.12.34

overrides:
  'js-yaml': 4.3.0 # For Chanfana

catalogMode: manual

cleanupUnusedCatalogs: true

minimumReleaseAge: 1440 # 24 hours

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
