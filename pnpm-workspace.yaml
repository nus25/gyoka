packages:
  - packages/*

blockExoticSubdeps: true

catalog:
  '@cloudflare/vitest-pool-workers': 0.15.2
  '@cloudflare/workers-types': 4.20260501.1
  '@types/node': 25.5.0
  'vite': 7.3.5
  'vitest': 4.1.10
  '@vitest/coverage-istanbul': 4.1.10
  wrangler: 4.87.0
  hono: 4.12.29

catalogMode: manual

cleanupUnusedCatalogs: true

minimumReleaseAge: 1440 # 24 hours

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
